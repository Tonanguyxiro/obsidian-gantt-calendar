name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run postinstall cleanup
        run: npm run postinstall

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx jest

      - name: Build
        run: npm run build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gantt-calendar-plugin
          path: |
            main.js
            manifest.json
            styles.css
